<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--  Tailwind CSS  -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Style CSS-->
    <link rel="stylesheet" href="./Assets/css/style.css">
    <!--Google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Animate Aos-->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!--CSS Stylesheet-->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script>
        // Configure Tailwind to use class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        };

        // IMMEDIATELY load theme on the root <html> element to completely prevent white screen flashing
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        })();
    </script>
    <!--Title-->
    <title>Happy Store-Dashboard</title>

</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen transition-colors duration-300">
    <div class="overall">

        <!-- Top Navbar (Fixed Height) -->
        <nav
            class="h-16 !bg-white dark:!bg-gray-900 border-b border-gray-200 dark:border-gray-800 transition-colors duration-300 z-30">
            <div class="px-4 flex items-center justify-between h-full w-full">

                <div class="flex items-center min-w-0 gap-2 sm:gap-3">
                    <button id="mobile-menu-btn"
                        class="text-gray-600 dark:text-gray-300 md:hidden p-1.5 sm:p-2 focus:outline-none hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg shrink-0">
                        <i class="bi bi-list text-xl sm:text-2xl"></i>
                    </button>

                    <div class="flex items-center shrink-0">
                         <a href="./index.html">
                            <img src="./Assets/images/logo.jpg" class="h-8 w-auto sm:h-10 mr-2 rounded-md" alt="Logo">
                        </a>
                        <span
                            class="text-base sm:text-xl font-bold text-blue-600 dark:text-blue-400 truncate">Dashboard</span>
                    </div>
                </div>

                <div class="text-right ml-4 shrink-0">
                    <span class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-300 block sm:inline">
                        <span class="text-gray-400 hidden xs:inline">Welcome, </span>Shree
                    </span>
                </div>

            </div>
        </nav>

        <!-- Parent Container (Remaining Height) -->
        <div class="flex w-full flex-1 overflow-hidden relative">

            <!-- Mobile Overlay Backdrop -->
            <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden transition-opacity"></div>

            <!-- Side Navbar (Responsive Drawer) -->
            <aside id="sidebar"
                class="fixed md:static inset-y-0 left-0 w-64 h-[calc(100vh-4rem)] top-16 !bg-white dark:!bg-gray-900 border-r border-gray-200 dark:border-gray-800 z-20 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
                <div class="h-full px-4 py-6 overflow-y-auto">
                    <ul class="space-y-4 font-medium">
                        <li>
                            <a href="#"
                                class="flex items-center p-3 text-blue-700 dark:text-blue-400 rounded-lg bg-blue-50 dark:bg-blue-950/40">
                                <i class="bi bi-speedometer2 text-lg"></i>
                                <span class="ml-3">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="inventory.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Inventory</span>
                            </a>
                        </li>
                        <li>
                            <a href="billing.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Billing</span>
                            </a>
                        </li>
                        <li>
                            <a href="reports.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Reports</span>
                            </a>
                        </li>
                    </ul>
                    <div class="pt-4 mt-4 border-t border-gray-100 dark:border-gray-800">
                        <a href="settings.html"
                            class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                            <i class="bi bi-gear text-lg text-gray-500 dark:text-gray-400"></i>
                            <span class="ml-3">Settings</span>
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area (Exact 3/4 Width) -->
            <main class="flex-1 !bg-gray-50 dark:!bg-gray-950 overflow-y-auto transition-colors duration-300">
                <div class="p-6 overflow-y-auto h-full space-y-6">

                    <!-- Summary Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Total Products Card -->
                        <div
                            class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm cursor-pointer hover:shadow-md transition-all">
                            <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">
                                Total Products</p>
                            <p id="total-val" class="text-3xl font-bold text-gray-900 dark:text-Red mt-2">0</p>

                        </div>

                        <!-- Low Stock Card -->
                        <div
                            class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-red-100 dark:border-red-950/30 shadow-sm cursor-pointer hover:shadow-md transition-all">
                            <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">Low
                                Stock</p>
                            <p id="low-val" class="text-3xl font-bold text-red-600 dark:text-red-400 mt-2">0</p>

                        </div>
                        <div id="expiry-card"
                            class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-orange-100 dark:border-orange-950/30 shadow-sm cursor-pointer hover:shadow-md transition-all">
                            <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">
                                Expiring Within
                                30 Days</p>
                            <p id="expiry-val" class="text-3xl font-bold text-orange-600 dark:text-orange-400 mt-2">0
                            </p>

                        </div>

                    </div>

                    <!-- Chart Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        <!-- Pie Chart Card -->
                        <div class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm transition-colors">
    <h3 class="text-sm font-bold text-gray-400 dark:text-white uppercase tracking-widest mb-4">
        Inventory Value Distribution (₹)<br>
        <span class="text-xs">Price*Stock</span>
    </h3>
    <div class="relative h-64">
        <canvas id="stockPieChart"></canvas>
    </div>
</div>

                        <!-- Bar Chart Card -->
                        <div
                            class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm transition-colors">
                            <h3 class="text-sm font-bold text-gray-400 dark:text-white uppercase tracking-widest mb-4">
                                Stock
                                Units by Category</h3>
                            <div class="relative h-64">
                                <canvas id="stockBarChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Table Section -->
                    <div
                        class="p-6 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm overflow-hidden transition-colors">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                            <div
                                class="bg-white dark:bg-gray-950 rounded-xl border border-red-100 dark:border-red-900/40 shadow-sm flex flex-col h-[500px] transition-colors">
                                <div
                                    class="p-4 border-b border-red-50 dark:border-red-900/30 flex justify-between items-center bg-red-50/30 dark:bg-red-950/20 rounded-t-xl">
                                    <h2
                                        class="text-sm font-bold text-red-700 dark:text-red-400 uppercase tracking-wider">
                                        Low Stock Alerts</h2>
                                    <span id="low-count-badge"
                                        class="bg-red-600 text-white text-xs px-2 py-1 rounded-full">0</span>
                                </div>
                                <div id="low-stock-container"
                                    class="p-4 overflow-y-auto space-y-3 flex-1 text-gray-900 dark:text-white">
                                </div>
                            </div>

                            <div
                                class="bg-white dark:bg-gray-950 rounded-xl border border-orange-100 dark:border-orange-900/40 shadow-sm flex flex-col h-[500px] transition-colors">
                                <div
                                    class="p-4 border-b border-orange-50 dark:border-orange-900/30 flex justify-between items-center bg-orange-50/30 dark:bg-orange-950/20 rounded-t-xl">
                                    <h2
                                        class="text-sm font-bold text-orange-700 dark:text-orange-400 uppercase tracking-wider">
                                        Expiring Soon</h2>
                                    <span id="expiry-count-badge"
                                        class="bg-orange-600 text-white text-xs px-2 py-1 rounded-full">0</span>
                                </div>
                                <div id="expiring-container"
                                    class="p-4 overflow-y-auto space-y-3 flex-1 text-gray-900 dark:text-white">
                                </div>
                            </div>

                            <div
                                class="bg-white dark:bg-gray-950 rounded-xl border border-blue-100 dark:border-blue-900/40 shadow-sm flex flex-col h-[500px] transition-colors">
                                <div
                                    class="p-4 border-b border-blue-50 dark:border-blue-900/30 flex justify-between items-center bg-blue-50/30 dark:bg-blue-950/20 rounded-t-xl">
                                    <h2
                                        class="text-sm font-bold text-blue-700 dark:text-blue-400 uppercase tracking-wider">
                                        Recent Additions</h2>
                                    <span id="recent-additions-count-badge"
                                        class="bg-blue-600 text-white text-xs px-2 py-1 rounded-full">0</span>
                                </div>
                                <div id="recent-container"
                                    class="p-4 overflow-y-auto space-y-3 flex-1 text-gray-900 dark:text-white">
                                </div>
                            </div>
                        </div>

                    </div>
            </main>
        </div>
    </div>
    <!-- Link to your shared script logic -->
   <script src="./Assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    

</body>

</html>

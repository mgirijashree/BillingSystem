<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--  Tailwind CSS  -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Style CSS-->
    <link rel="stylesheet" href="./Assets/css/style.css">
    <!--Google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Animate Aos-->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!--CSS Stylesheet-->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script>
        // Configure Tailwind to use class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        };

        // IMMEDIATELY load theme on the root <html> element to completely prevent white screen flashing
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        })();
    </script>
<!--QR Code-->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!--Title-->
    <title>Happy Store-Dashboard</title>

</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen transition-colors duration-300">
    <div class="overall">

        <!-- Top Navbar (Fixed Height) -->
        <nav
            class="h-16 !bg-white dark:!bg-gray-900 border-b border-gray-200 dark:border-gray-800 transition-colors duration-300 z-30">
            <div class="px-4 flex items-center justify-between h-full w-full">

                <div class="flex items-center min-w-0 gap-2 sm:gap-3">
                    <button id="mobile-menu-btn"
                        class="text-gray-600 dark:text-gray-300 md:hidden p-1.5 sm:p-2 focus:outline-none hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg shrink-0">
                        <i class="bi bi-list text-xl sm:text-2xl"></i>
                    </button>

                    <div class="flex items-center shrink-0">
                         <a href="./index.html">
                            <img src="./Assets/images/logo.jpg" class="h-8 w-auto sm:h-10 mr-2 rounded-md" alt="Logo">
                        </a>
                        <span
                            class="text-base sm:text-xl font-bold text-blue-600 dark:text-blue-400 truncate">Dashboard</span>
                    </div>
                </div>

                <div class="text-right ml-4 shrink-0">
                    <span class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-300 block sm:inline">
                        <span class="text-gray-400 hidden xs:inline">Welcome, </span>Shree
                    </span>
                </div>

            </div>
        </nav>

        <!-- Parent Container (Remaining Height) -->
        <div class="flex w-full flex-1 overflow-hidden relative">

            <!-- Mobile Overlay Backdrop -->
            <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden transition-opacity"></div>

            <!-- Side Navbar (Responsive Drawer) -->
            <aside id="sidebar"
                class="fixed md:static inset-y-0 left-0 w-64 h-[calc(100vh-4rem)] top-16 !bg-white dark:!bg-gray-900 border-r border-gray-200 dark:border-gray-800 z-20 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
                <div class="h-full px-4 py-6 overflow-y-auto">
                    <ul class="space-y-4 font-medium">
                        <li>
                            <a href="index.html"
                                class="flex items-center p-3 text-blue-700 dark:text-blue-400 rounded-lg bg-blue-50 dark:bg-blue-950/40">
                                <i class="bi bi-speedometer2 text-lg"></i>
                                <span class="ml-3">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="inventory.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Inventory</span>
                            </a>
                        </li>
                        <li>
                            <a href="billing.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Billing</span>
                            </a>
                        </li>
                        <li>
                            <a href="reports.html"
                                class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                <i class="bi bi-box-seam text-lg text-gray-500 dark:text-gray-400"></i>
                                <span class="ml-3">Reports</span>
                            </a>
                        </li>
                    </ul>
                    <div class="pt-4 mt-4 border-t border-gray-100 dark:border-gray-800">
                        <a href="settings.html"
                            class="flex items-center p-3 text-gray-700 dark:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                            <i class="bi bi-gear text-lg text-gray-500 dark:text-gray-400"></i>
                            <span class="ml-3">Settings</span>
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area (Exact 3/4 Width) -->
            <main class="flex-1 !bg-gray-50 dark:!bg-gray-950 overflow-y-auto transition-colors duration-300">
                <div class="p-6 overflow-y-auto h-full space-y-6">

                    <!-- Inner Card Layout Component updates color schemes altogether -->
                    <div
                        class="!bg-white dark:!bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-6 max-w-xl shadow-sm transition-all duration-300">
                        <h1 class="text-2xl font-bold mb-2 text-gray-900 dark:text-white">System Interface Settings</h1>
                        <!-- Secondary text description changed from dark:text-gray-400 to dark:text-white -->
                        <p class="text-gray-600 dark:text-white mb-6">Toggle your central interface configuration.
                            Changes will instantly propagate across the Dashboard, Inventory, and Settings layouts.</p>

                        <!-- Interacting Button -->
                        <button id="themeToggle"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-medium rounded-lg shadow transition-colors focus:outline-none">
                            Switch Theme
                        </button>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Shared persistent JS script -->
    <script src="./Assets/js/settings.js"></script>
</body>

</html>
